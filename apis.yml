aid: phil
name: Phil
description: PHIL (PHILRx) is a healthtech company operating a digital hub and direct-to-patient
  platform that helps pharmaceutical brands maximize prescription starts, insurance coverage,
  affordability, and medication adherence. Its all-in-one platform connects pharma manufacturers,
  patients, and healthcare providers to streamline the prescription access experience, run affordable
  direct-to-patient and cash-pay programs, and improve commercial performance across the medication
  access journey. PHIL is a portfolio company of Uncork Capital. As of this enrichment pass it exposes
  no public developer API, SDK, or documentation surface; this profile captures its identity and probed
  domain-security posture.
